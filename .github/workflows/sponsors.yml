name: sponsors

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go build -o sponsors .
      - run: ./sponsors generate --config gh://goreleaser/.github/sponsors.yml sponsors.json
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
      - run: ./sponsors apply sponsors.json gh://goreleaser/.github/sponsors.tpl.md README.md
      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: update sponsors"
          file_pattern: "README.md"
